# Debug mode overlay for nak-base
# Usage: docker-compose -f docker-compose.yml -f docker-compose.debug.yml up -d
#
# Mounts test scripts and enables memory/debug logging in the integrated backend.

services:
  backend:
    environment:
      PARSER_DEBUG_MEMORY: "true"
      PARSER_DEBUG: "true"
    volumes:
      - ./tests:/app/tests:ro
      - ./tests:/worker/tests:ro
      - ./tests/test_pdf:/test_pdf:ro
      - ./logs:/app/logs
